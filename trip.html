function render(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==="ar" ? "rtl" : "ltr";
  document.querySelectorAll(".lang-chip[data-lang]").forEach(function(b){ b.classList.toggle("active", b.dataset.lang===lang); });
  document.getElementById("backLink").textContent = U("back");
  var t = getTrip(), app = document.getElementById("app");
  if (!t) {
    app.innerHTML = '<h1>egyptguide</h1><ol class="route">'+TRIPS.map(function(x){
      return '<li><a href="trip.html?id='+x.id+'" style="color:inherit;text-decoration:none">'+x.t[lang]+'</a></li>';
    }).join("")+'</ol>';
    return;
  }
  document.title = t.t.en + " · egyptguide";
  var wa = "https://wa.me/201068635116?text=" + encodeURIComponent(U("wa") + t.t[lang]);
  app.innerHTML =
    (t.img ? '<div class="hero-img"><img src="'+t.img+'" alt="'+t.t[lang]+'"></div>' : '') +
    (t.credit ? '<p class="credit">'+U("photo")+': <a href="'+t.credit.u+'" target="_blank" rel="noopener">'+t.credit.t+'</a> — '+t.credit.by+', '+t.credit.lic+'</p>' : '') +
    '<h1>'+t.t[lang]+'</h1>'+
    '<div class="meta"><span class="pill">'+t.dur[lang]+'</span><span class="pill alt">'+t.loc[lang]+'</span></div>'+
    (t.d ? '<p class="desc">'+t.d[lang]+'</p>' : '')+
    ((t.route && t.route[lang] && t.route[lang].length) ? '<h2>'+U("route_h")+'</h2>'+
    '<p class="route-note">'+U("route_note")+'</p>'+
    '<ol class="route">'+t.route[lang].map(function(x){ return '<li>'+x+'</li>'; }).join("")+'</ol>' : '')+
    '<div class="pricebox"><span class="price">'+priceHtml(t)+'</span>'+((t.p&&t.g)?'<p class="route-note" style="margin:8px 0 0">'+U("incl")+'</p>':'')+'</div>'+
    '<a class="cta" href="'+wa+'" target="_blank" rel="noopener">'+U("cta")+'</a>';
}
(function(){
  var btn=document.getElementById("themeBtn"), r=document.documentElement;
  function isDark(){var c=r.getAttribute("data-theme");return c?c==="dark":matchMedia("(prefers-color-scheme: dark)").matches;}
  function paint(){btn.textContent=isDark()?"\u2600":"\u263E";btn.setAttribute("aria-pressed",isDark());}
  btn.addEventListener("click",function(){var n=isDark()?"light":"dark";r.setAttribute("data-theme",n);try{localStorage.setItem("eg-theme",n);}catch(e){}paint();});
  paint();
})();
document.querySelectorAll(".lang-chip[data-lang]").forEach(function(b){ b.addEventListener("click", function(){ lang=b.dataset.lang; render(); window.scrollTo(0,0); }); });
render();
</script>
</body>
</html>
