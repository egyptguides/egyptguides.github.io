<head>

<style>
:root{
  --bg:#f3f6f4; --surface:#ffffff; --ink:#0f2f33; --muted:#52696b;
  --nile:#0f4c52; --sun:#e2a21f; --lapis:#1f4f8f; --line:#d9e2de;
  --font-display:'Fraunces','Cairo',Georgia,serif; --font-body:'Manrope','Cairo',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);line-height:1.65}
img{max-width:100%;display:block}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.topbar{background:var(--nile);color:#fff;padding:10px 0}
.topbar .wrap{display:flex;justify-content:center;gap:10px}
.lang-chip{background:transparent;border:1.5px solid rgba(255,255,255,.65);color:#fff;border-radius:999px;padding:5px 16px;font:600 13px var(--font-body);cursor:pointer}
.lang-chip.active{background:#fff;color:var(--nile);border-color:#fff}
header.site{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 0}
header.site .wrap{display:flex;align-items:center;justify-content:space-between}
.logo{font:800 24px var(--font-display);color:var(--ink);text-decoration:none}
.logo span{color:var(--sun)}
.back{color:var(--lapis);font-weight:700;text-decoration:none;font-size:14px}
.hero-img{border-radius:20px;overflow:hidden;margin:22px 0 8px;box-shadow:0 6px 24px rgba(15,47,51,.12)}
.credit{font-size:12px;color:var(--muted);margin-bottom:14px}
.credit a{color:var(--muted)}
h1{font:800 30px/1.25 var(--font-display);margin:10px 0 12px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{background:#e6efed;color:var(--nile);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.pill.alt{background:#fdf3dd;color:#8a6414}
.desc{color:var(--muted);font-size:16px;margin-bottom:22px}
h2{font:800 20px var(--font-display);margin:0 0 10px;color:var(--lapis)}
ol.route{list-style:none;counter-reset:step;margin-bottom:26px}
ol.route li{counter-increment:step;position:relative;padding:10px 0 10px 46px;border-bottom:1px solid var(--line);font-size:15px}
html[dir="rtl"] ol.route li{padding:10px 46px 10px 0}
ol.route li::before{content:counter(step);position:absolute;top:10px;width:30px;height:30px;border-radius:50%;background:var(--nile);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
html[dir="ltr"] ol.route li::before{left:0}
html[dir="rtl"] ol.route li::before{right:0}
.pricebox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:22px}
.price{font:800 22px var(--font-body);color:var(--ink)}
.price small{font-weight:500;color:var(--muted);font-size:13px}
.cta{display:block;text-align:center;background:var(--sun);color:#231a04;font-weight:800;font-size:16px;padding:15px;border-radius:14px;text-decoration:none;margin-bottom:30px}
footer{border-top:1px solid var(--line);padding:18px 0;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>

<div class="topbar"><div class="wrap">

</div></header>
